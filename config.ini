
; 数据主密钥：内置基值为 sdwl88，此处 appKey 若有值会【拼接在基值后】一起派生真正密钥，
; 而非替换。留空则只用内置基值。注意：一旦设置，改动或清空会导致旧 data 无法解密。
[security]
appKey =

; 旧版遗留主密钥，仅用于一次性迁移旧 token_enc，新版不写回。
; 公开仓库请勿填写真实密钥；若确需迁移旧数据，请在本机临时填写，提交前删除。
;key =

; 注册授权码密钥：内置基值为 sdwl88，此处 secret 若有值会【拼接在基值后】，而非替换。
; 留空则只用基值 sdwl88。仅影响注册授权码 md5(用户名+密码+密钥) 校验。
[auth]
secret =
