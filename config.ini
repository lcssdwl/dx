
; 数据主密钥：内置基值为 sdwl88，此处 appKey 若有值会【拼接在基值后】一起派生真正密钥，
; 而非替换。留空则只用内置基值。注意：一旦设置，改动或清空会导致旧 data 无法解密。
[security]
appKey =

; 旧版遗留主密钥，仅用于一次性迁移旧 token_enc，新版不写回。
; 公开仓库请勿填写真实密钥；若确需迁移旧数据，请在本机临时填写，提交前删除。
;key =

; 注册授权码密钥：内置基值为 sdwl88，此处 secret 若有值会【拼接在基值后】，而非替换。
; 留空则只用基值 sdwl88。仅影响注册授权码 md5(用户名+密码+密钥) 校验。
[auth]
secret =

; HTTPS 设置（也可用环境变量 DX_TLS_ENABLED / DX_TLS_CERT / DX_TLS_KEY 覆盖）
; 默认启用内置 HTTPS 并自动生成自签证书（保存在数据目录，重启复用），
; 这样浏览器把页面视作安全上下文，前端加密所需的 crypto.subtle 才可用。
; 若已有正式证书，填写路径即可（两项需同时填写）：
;   内置 HTTPS 关闭（例如由 Nginx/Caddy 终止 TLS）时设 enabled = false，
;   此时如需 Secure Cookie 请显式设 DX_SECURE_COOKIE=true。
[tls]
enabled =
cert =
key =
