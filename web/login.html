<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>登录 · 云讯短信中心</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="auth-view">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">✉</div>
        <div>
          <h1>云讯短信中心</h1>
          <p>多用户短信接收与管理平台</p>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="login" role="tab">登录</button>
        <button class="tab" data-tab="register" role="tab">注册</button>
      </div>
      <form id="loginForm" class="auth-form">
        <label>用户名<input name="username" autocomplete="username" placeholder="3-32 位字母数字下划线" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" placeholder="至少 6 位" required></label>
        <div id="captchaRow" class="captcha-row hidden">
          <label>图形验证码<input name="captcha_text" placeholder="请输入右侧字符" autocomplete="off"></label>
          <div class="captcha-side">
            <img id="captchaImg" alt="验证码" title="点击换一张">
            <button type="button" class="link-btn" id="btnRefreshCaptcha">换一张</button>
          </div>
        </div>
        <button class="btn primary block" type="submit">登录</button>
        <div class="auth-links"><button type="button" class="link-btn" id="btnForgot">忘记密码？</button></div>
      </form>
      <form id="registerForm" class="auth-form hidden">
        <label>用户名<input name="username" autocomplete="username" placeholder="3-32 位字母数字下划线" required></label>
        <label>密码<input name="password" type="password" autocomplete="new-password" placeholder="至少 6 位"></label>
        <label>授权码<input name="auth_code" placeholder="密钥" autocomplete="off" required></label>
        <button class="btn primary block" type="submit">注册并获取 Token</button>
      </form>
      <p class="hint">注册需授权码。注册后系统自动生成唯一 Token，用于设备端上报短信及数据加密。</p>
    </div>
  </section>

  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script src="login.js"></script>
</body>
</html>
